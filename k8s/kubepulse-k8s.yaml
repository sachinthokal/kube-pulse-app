apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubepulse-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubepulse-version-reader
rules:
- nonResourceURLs: ["/version", "/version/*"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubepulse-read-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubepulse-version-reader
subjects:
- kind: ServiceAccount
  name: kubepulse-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubepulse
  template:
    metadata:
      labels:
        app: kubepulse
    spec:
      serviceAccountName: kubepulse-sa
      containers:
      - name: web
        image: kubepulseacr20567.azurecr.io/kubepulse:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "v1.0.0"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kubepulse-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: kubepulse
  ports:
  - port: 80
    targetPort: 8080